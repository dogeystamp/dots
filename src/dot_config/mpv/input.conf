CTRL+c quit-watch-later 4

CTRL+e script-binding osc/visibility
SHIFT+s script-message save

CTRL+j seek 1
CTRL+k seek -1

+ add video-zoom 0.1
- add video-zoom -0.1

h add video-pan-x +0.05
l add video-pan-x -0.05
j add video-pan-y -0.05
k add video-pan-y +0.05

# [R]eset
R set video-pan-x 0; set video-pan-y 0; set video-zoom 0; set video-rotate 0
# [r]otate
r cycle video-rotate 90

b cycle sub

################
# filters
################

# shuffle frames 
F1 vf toggle random
# fade sudden flashes
F2 vf toggle photosensitivity
# after-image
F3 vf toggle lagfun
# after-image (stronger)
F4 vf toggle lagfun:decay=0.995

# pitch warble effect
F5 af toggle vibrato:f=2:d=1
# pitch warble effect (worse)
F6 af toggle vibrato:f=15:d=.5
# "8d audio"
F7 af toggle apulsator:hz=0.4
# potato quality filter
F8 vf toggle scale=200:150

# something?
F9 af toggle rubberband=pitch-scale=0.25,rubberband=pitch-scale=4
# normalize audio volume levels (the only useful bind)
F10 af toggle dynaudnorm=f=75:g=25:p=0.55
# tune one semitone down
F11 af add rubberband=pitch-scale=0.9438743126816935
# tune one semitone up
F12 af add rubberband=pitch-scale=1.0594630943592953
